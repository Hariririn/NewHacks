<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Journal</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <header>
        <div class="header-title" contenteditable="true" id="pageTitle">welcome to your world</div>
    </header>

    <div class="container">
        <div id="map"></div>

        <div class="sidebar">
            <div class="view-toggle">
                <button class="view-tab" id="searchViewTab">search places</button>
                <button class="view-tab active" id="spotsViewTab">my spots</button>
            </div>

            <div class="sidebar-header search-view" id="searchView" style="display: none;">
                <h2 class="editable-heading">find a place</h2>
                <div class="place-search-box">
                    <input type="text" id="placeSearchInput" placeholder="search for any place or address...">
                    <div class="place-search-results" id="placeSearchResults"></div>
                </div>
            </div>

            <div class="sidebar-header" id="spotsView">
                <h2 class="editable-heading" contenteditable="true">my spots</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="search locations...">
                </div>
                <div class="pin-categories">
                    <button class="pin-btn visited active" data-category="visited">
                        <span class="pin-color"></span>
                        visited
                    </button>
                    <button class="pin-btn plan-to-visit" data-category="plan-to-visit">
                        <span class="pin-color"></span>
                        to visit
                    </button>
                </div>
            </div>

            <div class="tabs-section" id="tabsSection">
                <div class="tabs-container" id="tabsContainer">
                    <button class="tab active" data-folder="all">all</button>
                    <button class="tab" data-folder="food">food</button>
                    <button class="tab" data-folder="views">views</button>
                    <button class="tab" data-folder="places">places</button>
                    <button class="add-tab-btn" id="addTabBtn">+</button>
                </div>
            </div>

            <div class="locations-list" id="locationsList">
                <div class="empty-state">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <p>click on the map to add a location</p>
                </div>
            </div>

            <button class="clear-btn" id="clearBtn">clear all pins</button>
        </div>
    </div>

    <div class="modal" id="locationModal">
        <div class="modal-content">
            <div class="modal-header">add location</div>

            <div class="form-group">
                <label>location name</label>
                <input type="text" id="locationName" placeholder="e.g., local cafe">
            </div>

            <div class="form-group">
                <label>folder</label>
                <select id="folderSelect">
                    <option value="food">food</option>
                    <option value="views">views</option>
                    <option value="places">places</option>
                </select>
            </div>

            <div class="form-group">
                <label>rating</label>
                <div class="star-rating" id="starRating">
                    <span class="star" data-rating="1">★</span>
                    <span class="star" data-rating="2">★</span>
                    <span class="star" data-rating="3">★</span>
                    <span class="star" data-rating="4">★</span>
                    <span class="star" data-rating="5">★</span>
                </div>
            </div>

            <div class="form-group">
                <label>notes</label>
                <textarea id="locationNotes" placeholder="add your thoughts..."></textarea>
            </div>

            <div class="form-group">
                <label>photo</label>
                <div class="image-upload" id="imageUpload">
                    <p>click to upload</p>
                    <img id="imagePreview" class="image-preview" style="display: none;">
                </div>
                <input type="file" id="imageInput" accept="image/*" style="display: none;">
            </div>

            <div class="modal-actions">
                <button class="btn-secondary" id="cancelBtn">cancel</button>
                <button class="btn-primary" id="saveBtn">save</button>
            </div>
        </div>
    </div>

    <div class="modal" id="viewLocationModal">
        <div class="modal-content">
            <div class="modal-header" id="viewLocationName">Location Details</div>

            <div class="form-group">
                <label>rating</label>
                <div class="rating" id="viewLocationRating"></div>
            </div>

            <div class="form-group" id="viewLocationNotesGroup" style="display: none;">
                <label>notes</label>
                <div id="viewLocationNotes" style="color: #78716c; font-size: 0.875rem; line-height: 1.5;"></div>
            </div>

            <div class="form-group" id="viewLocationImageGroup" style="display: none;">
                <img id="viewLocationImage" style="width: 100%; border-radius: 8px; margin-top: 0.5rem;">
            </div>

            <div class="modal-actions">
                <button class="btn-danger" id="deleteLocationBtn">delete</button>
                <button class="btn-primary" id="closeViewBtn">close</button>
            </div>
        </div>
    </div>

    <div class="modal" id="newFolderModal">
        <div class="modal-content">
            <div class="modal-header">create folder</div>

            <div class="form-group">
                <label>folder name</label>
                <input type="text" id="newFolderName" placeholder="e.g., museums">
            </div>

            <div class="modal-actions">
                <button class="btn-secondary" id="cancelFolderBtn">cancel</button>
                <button class="btn-primary" id="createFolderBtn">create</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>

</html>
