<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footprint</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <h1>Interactive Map</h1>
    <div class="controls">
        <button onclick="clearPins()">Clear All Pins</button>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize the map
        const map = L.map('map').setView([43.6532, -79.3832], 13);

        // Add the OpenStreetMap tiles
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // Array to store markers
        let markers = [];

        // Load pins from localStorage
        function loadPins() {
            const savedPins = localStorage.getItem('mapPins');
            if (savedPins) {
                const pins = JSON.parse(savedPins);
                pins.forEach(pin => {
                    const marker = L.marker([pin.lat, pin.lng]).addTo(map);
                    markers.push(marker);
                });
            }
        }

        // Save pins to localStorage
        function savePins() {
            const pins = markers.map(marker => {
                const position = marker.getLatLng();
                return {
                    lat: position.lat,
                    lng: position.lng
                };
            });
            localStorage.setItem('mapPins', JSON.stringify(pins));
        }

        // Clear all pins
        function clearPins() {
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];
            localStorage.removeItem('mapPins');
        }

        // Add click handler to map
        map.on('click', function(e) {
            const marker = L.marker(e.latlng).addTo(map);
            markers.push(marker);
            savePins();
        });

        // Load saved pins when the page loads
        loadPins();
    </script>
</body>
</html>
